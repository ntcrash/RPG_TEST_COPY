name: CI

# Roadmap P2 #9 — run the test suite plus a py_compile / lint pass on every
# push and PR against the gitflow integration branches. Kept deliberately
# lightweight so it works headlessly on GitHub-hosted runners.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # Allow manual runs from the Actions tab.
  workflow_dispatch:

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    # Pygame/Arcade open SDL/OpenGL contexts; force dummy drivers so nothing
    # needs a real display or audio device on the runner.
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Byte-compile all sources (py_compile)
        run: python -m py_compile main.py arcade_app.py server_app.py Code/*.py

      - name: Lint (ruff)
        # Blocking gate: the codebase is Ruff-clean as of v3.2.0 (the pre-existing
        # findings tracked in the CHANGELOG ToDo were cleaned up), so any new
        # finding now fails the build.
        run: ruff check .

      - name: Run test suite (unittest, headless)
        run: python -m unittest discover -s tests -v
